name: 上传课程资料
description: 直接上传试卷、笔记或解析，无需网盘链接
title: "[资料投稿] "
body:
  - type: markdown
    attributes:
      value: 选择或拖入文件，然后确认资料信息并提交。附件公开可访问，审核后加入课程目录。
  - type: upload
    id: files
    attributes:
      label: 上传文件
      description: 点击选择或拖入文件。PDF、Office 文档、ZIP 和文本不超过 25 MB，图片不超过 10 MB。
    validations:
      required: true
      accept: ".pdf,.docx,.xlsx,.pptx,.zip,.gz,.tar.gz,.png,.jpg,.jpeg,.gif,.webp,.txt,.csv"
  - type: textarea
    id: details
    attributes:
      label: 课程与资料信息
      description: 从网站进入时会自动填写，请核对课程号、标题、类型和分享许可。
      value: |
        ## 资料信息
        - 课程及课程号：
        - 标题：
        - 类型：
        - 年份 / 学期：

        ## 来源与分享许可
        请说明作者、原始出处及允许公开分享的依据。

        ## 补充说明
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 投稿确认
      options:
        - label: 我确认来源准确，资料可以公开分享。
          required: true
        - label: 我已检查文件，不包含个人信息或未结束考试的内容。
          required: true
